        * {

        }

        body {
            margin: 0;

            background: #000000;
            background-image:

        .container {

        }

        .welcome {

        }

        .welcome h3 {

            font-size: 12px;
            color: #ffffff;

            overflow: hidden;
            border-right: .15em solid #f0aa05;

            white-space: nowrap;
            letter-spacing: .09em;

            animation:
                typing 3.5s steps(40, end),
                blink-caret .75s step-end infinite;
        }

        @keyframes typing {
            from {
                width: 0
            }

            to {
                width: 100%
            }
        }

        @keyframes blink-caret {

            from,
            to {
                border-color: transparent
            }

            50% {
                border-color: #f0aa05;
            }
        }

        .banner {
            display: block;
            width: 100%;
            height: auto;

            margin-top: 10px;

            border-radius: 10px;
        }

        .button {

            color: #f0aa05;

            font-size: 18px;
            font-weight: bold;

            text-align: center;
            text-decoration: none;

            background: #0b90a7;

            border-radius: 10px;

            transition: .2s;
        }

        .button:hover {
            filter: brightness(1.15);
        }

        .button-order {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {

            0% {
                opacity: 1;
            }

            50% {
                opacity: .6;
            }

            100% {
                opacity: 1;
            }
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-spacing: 2px;

            text-align: center;
            border-radius: 5px;

            color: #f0aa05;
